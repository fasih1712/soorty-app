<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Soorty{% endblock %}</title>
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">
  <style>
    /* Bare form surface for the drawer — no shell */
    body { background: var(--surface); }
    .page-content { padding: 20px; overflow: visible; }
    .erp-card { box-shadow: none; border: none; padding: 0; }
    .erp-card-header { display: none; } /* drawer header already shows the title */
  </style>
</head>
<body data-embed="1">
  <main class="page-content">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
          {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
  <script>
    /* Signal the parent list page when a save has completed.
       On success the add-view redirects away from the *_add URL; when this
       embedded page is no longer an "/add/" page, tell the parent to refresh. */
    (function () {
      if (!window.location.pathname.match(/\/add\/?$/)) {
        if (window.parent && window.parent !== window && window.parent.erpDrawerOnSaved) {
          window.parent.erpDrawerOnSaved();
        }
      }
    })();
  </script>
</body>
</html>
