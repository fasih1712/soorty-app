<style>
/* Finance theme - scoped to .fin-theme so no other ERP screen changes */
.fin-theme{--navy:#1F3A5F;--navy-dark:#16283F;--gold:#B08D57;--grey:#5B6472;--light:#F4F6F8;--line:#D9DEE4;--ok:#2E7D5B;--warn:#B0761A;--danger:#B03A2E;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1a1a1a}
.fin-theme .fin-card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:none;overflow:hidden}
.fin-theme .fin-card-head{background:#fff;border-bottom:1px solid var(--line);padding:.75rem 1rem;font-weight:600;color:var(--navy-dark);font-size:.92rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
.fin-theme .fin-card-body{padding:1rem}
.fin-theme .stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;height:100%;border-top:3px solid var(--gold)}
.fin-theme .stat-card .label{font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:.04em}
.fin-theme .stat-card .value{font-size:1.4rem;font-weight:700;color:var(--navy-dark);margin-top:.15rem}
.fin-theme .stat-card .sub{font-size:.74rem;color:var(--grey)}
.fin-theme .table{font-size:.84rem;margin-bottom:0}
.fin-theme .table thead th{background:var(--navy);color:#fff;font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;border:none;padding:.6rem .75rem;white-space:nowrap}
.fin-theme .table tbody td{padding:.55rem .75rem;vertical-align:middle;border-color:var(--line)}
.fin-theme .table tbody tr:nth-child(even){background:#fafbfc}
.fin-theme .table-hover tbody tr:hover{background:#eef2f7}
.fin-theme .badge-status{display:inline-block;font-weight:600;font-size:.68rem;padding:.32rem .55rem;border-radius:5px}
.fin-theme .badge-ok{background:#E4F3EC;color:var(--ok)}
.fin-theme .badge-warn{background:#FBF0DD;color:var(--warn)}
.fin-theme .badge-danger{background:#FAE6E3;color:var(--danger)}
.fin-theme .badge-neutral{background:var(--light);color:var(--grey);border:1px solid var(--line)}
.fin-theme .btn-navy{background:var(--navy);border-color:var(--navy);color:#fff;font-size:.84rem}
.fin-theme .btn-navy:hover{background:var(--navy-dark);border-color:var(--navy-dark);color:#fff}
.fin-theme .btn-gold{background:var(--gold);border-color:var(--gold);color:#fff;font-size:.84rem}
.fin-theme .btn-gold:hover{background:#96754a;border-color:#96754a;color:#fff}
.fin-theme .btn-outline-navy{border-color:var(--navy);color:var(--navy);font-size:.84rem;background:#fff}
.fin-theme .btn-outline-navy:hover{background:var(--navy);color:#fff}
.fin-theme .btn-outline-danger-fin{border:1px solid var(--danger);color:var(--danger);font-size:.84rem;background:#fff}
.fin-theme .btn-outline-danger-fin:hover{background:var(--danger);color:#fff}
.fin-theme .mini-btn{font-size:.72rem;padding:.2rem .5rem}
.fin-theme .form-label{font-size:.78rem;font-weight:600;color:var(--navy-dark);margin-bottom:.25rem}
.fin-theme .form-control,.fin-theme .form-select{font-size:.85rem}
.fin-theme .form-control:focus,.fin-theme .form-select:focus{border-color:var(--navy);box-shadow:0 0 0 .2rem rgba(31,58,95,.12)}
.fin-theme ::placeholder{font-size:.82rem}
.fin-theme .section-note{background:var(--light);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:.6rem .9rem;font-size:.8rem;color:var(--grey);font-style:italic}
.fin-theme .report-card{display:block;border:1px solid var(--line);border-radius:10px;padding:1rem;height:100%;background:#fff;text-decoration:none;transition:.15s}
.fin-theme .report-card:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(31,58,95,.08)}
.fin-theme .report-card i{font-size:1.3rem;color:var(--gold)}
.fin-theme .report-card .rname{font-weight:600;color:var(--navy-dark);font-size:.9rem;margin-top:.4rem}
.fin-theme .report-card .rdesc{font-size:.76rem;color:var(--grey);margin-top:.15rem}
.fin-theme .text-money{font-variant-numeric:tabular-nums}
.fin-theme .fin-alert{border-radius:6px;padding:.6rem .9rem;font-size:.82rem;margin-bottom:1rem}
.fin-theme .fin-alert-danger{background:#FAE6E3;color:var(--danger);border-left:3px solid var(--danger)}
.fin-theme .fin-alert-info{background:#EAF0F7;color:var(--navy);border-left:3px solid var(--navy)}
.fin-theme .fin-table-wrap{overflow-x:auto}
</style>
