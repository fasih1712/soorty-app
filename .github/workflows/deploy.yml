name: Build & Deploy to EC2

on:
  # Auto-deploy on push is OFF until the EC2 target + secrets are set up.
  # To enable, uncomment:
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  APP_DIR: /opt/soorty

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io image names must be lowercase: ghcr.io/aftr-solutions/wastage-management-system
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Copy compose file + DB init scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,postgres/01_schema.sql,postgres/02_seed.sql"
          target: ${{ env.APP_DIR }}

      - name: Pull & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e
            # t3.micro has 1 GB RAM: make sure a 2 GB swap file exists (one-time, idempotent)
            if ! sudo swapon --show | grep -q '/swapfile'; then
              sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile
              sudo mkswap /swapfile && sudo swapon /swapfile
              grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            cd ${{ env.APP_DIR }}
            if [ ! -f .env ]; then
              echo "ERROR: ${{ env.APP_DIR }}/.env missing on server. Create it from .env.example first."
              exit 1
            fi
            export SOORTY_IMAGE="$IMAGE"
            echo "Deploying image: $SOORTY_IMAGE:latest"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            sleep 25
            docker compose -f docker-compose.prod.yml ps
            docker logs --tail 40 soorty-app
